[project]
name = "robot"
version = "0.1.0"
description = "Recording, training, and running policies for an SO-101 arm"
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech,dataset]==0.6.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "evdev>=1.7; sys_platform == 'linux'",
    "torch",
    "torchvision",
]

[project.scripts]
robot = "robot.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

# The Jetson runs LeRobot on the CPU (GPU PyTorch for JetPack 6 is only built for Python 3.10),
# so use the small CPU-only PyTorch everywhere.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
