name: tv

# Every push to main builds a signed APK and replaces the "latest" release with it.
# A tv-v* tag publishes a numbered release. Pull requests only check that the app builds.
on:
  push:
    branches: ["main"]
    tags: ["tv-v*"]
  pull_request:
    paths: ["tv/**", ".github/workflows/tv.yml"]

defaults:
  run:
    working-directory: tv

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug

  signed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: tv-release  # one release update at a time
    permissions:
      contents: write  # for publishing releases
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_VERSION_CODE: ${{ github.run_number }}
          TV_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          export TV_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$TV_KEYSTORE_BASE64" | base64 -d > "$TV_KEYSTORE_FILE"
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk robot-tv.apk

      - name: Replace the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest robot-tv.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7} on main."

      - name: Publish numbered release
        if: startsWith(github.ref, 'refs/tags/tv-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" robot-tv.apk --title "TV app ${GITHUB_REF_NAME#tv-}" --generate-notes
