name: tv

# Every change builds the app. Pushing a tag like tv-v1.2 publishes a signed APK as a release.
on:
  push:
    branches: ["**"]
    tags: ["tv-v*"]
    paths: ["tv/**", ".github/workflows/tv.yml"]  # not applied to tag pushes
  pull_request:
    paths: ["tv/**", ".github/workflows/tv.yml"]

defaults:
  run:
    working-directory: tv

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/tv-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TV_VERSION_CODE: ${{ github.run_number }}
          TV_VERSION_NAME: ${{ github.ref_name }}
        run: |
          export TV_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$TV_KEYSTORE_BASE64" | base64 -d > "$TV_KEYSTORE_FILE"
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "robot-tv-${GITHUB_REF_NAME#tv-}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" robot-tv-*.apk --title "TV app ${GITHUB_REF_NAME#tv-}" --generate-notes
